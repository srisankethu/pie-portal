# The gate from CLAUDE.md §6, run by a machine instead of by memory.
#
# The checks themselves live in ./scripts/verify.sh, which `make verify` also
# runs. That is deliberate: this file used to restate what CLAUDE.md §6 told a
# person to run, the two lists drifted, and the drift was invisible for eight
# consecutive merges to main — CI installed ruff unpinned and reported 1314
# errors against an unchanged tree, and because lint ran before pytest in one
# job the 1174-test suite was skipped every run. One list, run from both places.
#
# Five jobs, and the split is on a real axis rather than a cosmetic one:
#
#   invariants / frontend  fast, and independent of the pie-parser engine, so
#                          they keep giving signal whatever happens to it. They
#                          repeat a check `verify` also runs; that duplication
#                          is the point, and `verify` stays complete regardless.
#   verify                 the whole gate, including `alembic upgrade head` on an
#                          EMPTY database — the check §4 was written about, and
#                          the one nobody runs on an already-migrated laptop.
#                          Runs twice over: SQLite, then a disposable Postgres
#                          (scripts/pg_sandbox.sh — the runner image ships the
#                          server binaries), because production migrates
#                          Postgres and a chain proven only on SQLite isn't
#                          proven. Then the restore drill on that same server:
#                          docs/hosting.md's backup procedure, actually
#                          performed, because an untested backup is a hypothesis
#                          about a file.
#   pie-credential         six seconds and one question: is PIE_PARSER_TOKEN
#                          set? It exists as a job because the `secrets` context
#                          cannot be read from a job-level `if`, and `needs`
#                          can.
#   pie-contract           the only job that needs a credential. Without one it
#                          is SKIPPED — not failed, and never reported as
#                          passed. The split is what keeps a missing or expired
#                          token from taking the whole gate down with it, while
#                          still refusing to call the seam tested when it was
#                          not.
name: gate

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch supersedes the first. The gate is a
# statement about the head commit, so testing an overtaken one is spend with no
# reader.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    name: §1 invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The two greps CLAUDE.md §1 tells a human to run. `test_layer_boundaries`
      # covers the same ground by parsing imports, and is the check that blocks
      # — this runs anyway because it is seconds, and because a failure here is
      # legible without reading a traceback.
      - name: Deterministic layers must not import ai/
        run: |
          if grep -rnE '^\s*(from|import)\s+\.*\.?ai[. ]' \
               backend/app/commercial backend/app/signals \
               backend/app/ingestion backend/app/state; then
            echo "::error::A deterministic layer imports ai/. Prices, margins and"
            echo "::error::priorities are computed there and only read in ai/."
            exit 1
          fi
      - name: ai/ must not import commercial/
        run: |
          if grep -rnE '^\s*(from|import)\s+.*commercial' backend/app/ai; then
            echo "::error::ai/ imports commercial/. It receives facts; it must"
            echo "::error::never be able to compute one."
            exit 1
          fi

  frontend:
    name: frontend — types + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        # The browsers are not needed to typecheck or build, and downloading
        # them on every run is minutes for nothing.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: tsc + vite build
        working-directory: frontend
        run: npm run build

  verify:
    name: verify — lint, tests, frontend, migrations
    runs-on: ubuntu-latest
    steps:
      # checkout@v4 / setup-python@v5 / setup-node@v4 target Node 20, which
      # GitHub now forces onto Node 24 with a deprecation warning. They run
      # correctly; bumping to the Node 24 majors is a separate one-line change
      # that should be made once and watched go green, not bundled in here.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # requirements-dev.txt pins ruff, pytest, pytest-xdist and cffi exactly,
      # and ruff.toml writes the rule set down. Both halves are needed: a pinned
      # version with implicit rules breaks on the next bump, and a written rule
      # can still change meaning between versions. cffi is here because without
      # it Debian's `cryptography` panics at import and takes 22 test modules
      # with it at collection.
      - name: install pinned tooling
        run: python -m pip install -r backend/requirements-dev.txt

      - name: install frontend dependencies
        working-directory: frontend
        # The browsers are not needed to typecheck or build, and downloading
        # them on every run is minutes for nothing.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # The same script a developer runs. Lint, the §1 invariants, the backend
      # suite (parallel, per-worker databases), the frontend production build,
      # and `alembic upgrade head` on an EMPTY database plus the drift test and
      # the single-head check — on SQLite and then on a disposable Postgres
      # the script provisions itself (scripts/pg_sandbox.sh) — and finally the
      # restore drill against that same server.
      #
      # The pie-parser submodule is deliberately NOT fetched here. Without the
      # engine, conftest skips the `requires_pie` tests and everything else runs
      # — so this job needs no credential and cannot be held hostage by one.
      # The seam those tests cover is the `pie-contract` job's whole purpose.
      #
      # verify.sh runs every check and reports all failures at the end rather
      # than stopping at the first, so one red build names everything that is
      # wrong — the specific behaviour whose absence hid the suite behind lint.
      - name: verify
        run: ./scripts/verify.sh

  # pie-parser is a private repository and the automatic GITHUB_TOKEN is scoped
  # to *this* one, so fetching the submodule needs a credential of its own.
  # Whether that credential exists decides whether the contract job can run at
  # all — and the `secrets` context is not readable from a job-level `if`, so
  # the question gets asked here and answered through `needs`.
  #
  # This job never fails. Its whole purpose is to turn a missing secret into a
  # value the next job can branch on.
  pie-credential:
    name: pie-parser credential
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - name: Is PIE_PARSER_TOKEN set?
        id: probe
        env:
          PIE_PARSER_TOKEN: ${{ secrets.PIE_PARSER_TOKEN }}
        run: |
          if [ -n "${PIE_PARSER_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "pie-parser credential present — the contract job will run."
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          # A warning, not an error, and the same words in the run summary. The
          # annotation is what a reader sees without opening a job; the summary
          # is what survives on the run page after the annotation scrolls away.
          echo "::warning title=pie-parser contract SKIPPED::\
          PIE_PARSER_TOKEN is unset or empty, so the pinned engine was not \
          fetched and the seam is UNTESTED this run. Either no secret has been \
          added yet, or a fine-grained token expired. Issue one with \
          Contents:Read on srisankethu/pie-parser only, and set it under \
          Settings -> Secrets and variables -> Actions."
          {
            echo "### pie-parser contract: SKIPPED"
            echo
            echo "\`PIE_PARSER_TOKEN\` is unset or empty, so the pinned engine"
            echo "was not fetched and **the engine seam is untested this run**."
            echo "Every other check still ran and still means what it says."
            echo
            echo "To cover it: issue a fine-grained PAT with \`Contents:Read\`"
            echo "on \`srisankethu/pie-parser\` only, and add it as the"
            echo "repository secret \`PIE_PARSER_TOKEN\` under"
            echo "**Settings → Secrets and variables → Actions**."
          } >> "$GITHUB_STEP_SUMMARY"

  # The check that would have caught the pin skew. pie-parser is vendored as a
  # submodule, so the commit this repo resolves against is a line in the index —
  # but a pin that nothing executes is a pin nobody has tested. Moving it used
  # to be verified by hand, and the last move was made *because* the previous
  # commit made every scoped line resolve to nothing at all, which is exactly
  # the kind of failure a green build should not survive.
  #
  # Deliberately its own job rather than steps inside `verify`: the seam is
  # what this proves, and a failure here should name the engine rather than
  # hide behind an unrelated lint or unit failure.
  pie-contract:
    name: pie-parser contract — the pinned engine still resolves
    needs: pie-credential
    # Skipped, never silently passed. This job once failed outright on a missing
    # credential, on the reasoning that a fine-grained PAT expires and a step
    # that merely warns would go back to reporting success in six seconds having
    # fetched and run nothing. The failure mode is real; making the job red was
    # the wrong answer to it. No secret had in fact been added, so every run of
    # the gate went red — on main and on PRs that were entirely fine — for a
    # cause no contributor without repository admin could fix. That is the
    # always-red check this repository already has an incident about, and an
    # always-red check takes the checks that mattered down with it.
    #
    # `skipped` is the honest third state, and it is not `success`: the check
    # appears greyed out in the list rather than ticked, pie-credential leaves a
    # warning annotation and a run-summary block naming exactly what went
    # uncovered, and the day the secret is added — or reissued after it expires
    # — this job runs again with no change to this file.
    #
    # The trade-off, stated rather than hidden: an expired token now produces a
    # warning where it used to produce a failure. If this repository ever needs
    # the engine seam to be a blocking condition of merge, the way to get that
    # is a branch-protection rule requiring this check, not a job that goes red
    # for everyone the moment a credential lapses.
    if: needs.pie-credential.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned commit
        id: pin
        # Read out of this repo's index — exact, and available before the
        # submodule is fetched. The cache key below is keyed on it.
        run: echo "pin=$(git rev-parse HEAD:pie-parser)" >> "$GITHUB_OUTPUT"

      - name: Fetch pie-parser at the pinned commit
        env:
          PIE_PARSER_TOKEN: ${{ secrets.PIE_PARSER_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PIE_PARSER_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive pie-parser
          echo "pinned at $(git -C pie-parser rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: install
        run: pip install -r backend/requirements.txt

      # The catalogue is ~13 MB decoded from the corpus and is a pure function
      # of the pinned commit, so it is cached against exactly that — a pin move
      # invalidates it, which is the one time it must be rebuilt.
      - name: Cache the decoded catalogue
        uses: actions/cache@v4
        with:
          path: backend/data/products.jsonl
          key: pie-catalog-${{ steps.pin.outputs.pin }}

      # Selected by marker, not by a list of files: `requires_pie` is already
      # how conftest decides what to skip without an engine, so the set this
      # runs is by construction exactly the set the `backend` job could not
      # cover. A new engine-backed test is picked up by marking it, and a file
      # list here could not go stale because there isn't one.
      - name: The engine resolves what the portal expects
        working-directory: backend
        run: python -m pytest -q -m requires_pie tests

      # A marker that selects nothing means the seam is no longer covered —
      # most likely someone removed the last marked test, which should be a
      # deliberate act rather than a quietly green job.
      - name: The contract must actually cover something
        working-directory: backend
        run: |
          n=$(python -m pytest -q -m requires_pie --collect-only tests 2>/dev/null \
              | grep -c '::' || true)
          echo "engine-backed tests: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::No tests are marked requires_pie — the pinned engine is untested."
            exit 1
          fi

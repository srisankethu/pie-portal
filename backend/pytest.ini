[pytest]
testpaths = tests
# The live contract suites call a real model and a real Zoho book — they cost
# money and need credentials — so they are excluded from the default run.
# Opt in with:  pytest -m live   (or `make test-live`, or the live.yml workflow)
#
# The connector matrix is excluded for a different reason: not cost, but time.
# The pins that must never regress live in test_erp_connectors.py and run on
# every push; the matrix is the combinatorial sweep behind them, and 204 fresh
# databases is eighty seconds the edit loop should not pay. It is NOT redundant
# with those pins — this comment said it was, and the sweep's own adoption
# topology fails on all seven connectors against a defect one targeted pin
# covers for one. So it is excluded here and run in the gate:
# scripts/verify.sh runs it under xdist (about 25s), and `make test-matrix`
# runs it alone. Opt in from a shell with:  pytest -m matrix
addopts = -m "not live and not matrix"
markers =
    live: exercises a real external system — the AI provider or the Zoho Books
        API; requires credentials; excluded by default
    matrix: the full connector matrix — every ordered pair of connectors in four
        sync topologies, plus adoption per connector; slow, so excluded from the
        default run and run by scripts/verify.sh instead

# The contract suites that talk to something real, on a schedule.
#
# Both suites in `backend/tests/live/` were written, reviewed and merged, and
# then never ran. `pytest.ini` carries `addopts = -m "not live"`, which is
# correct — they cost money and need credentials, so they must not run on every
# push — but nothing else ran them either. A test that never runs is
# documentation with a misleading file extension.
#
# So they run here, weekly and on demand. Weekly rather than per-push because
# what they watch changes on someone else's release schedule, not on ours: a
# model's behaviour, and Zoho's response shapes. Neither is affected by the
# commit that triggered a build, which is exactly why this is a separate
# workflow and not another job in `gate.yml` — a red mark here means "the world
# moved", and confusing that with "your change is broken" would get the whole
# thing switched off.
name: live contracts

on:
  schedule:
    # 04:00 UTC on Monday — 09:30 IST, so a failure is waiting at the start of
    # the week rather than discovered mid-incident.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which contract suite to run"
        type: choice
        default: all
        options: [all, ai, zoho]

permissions:
  contents: read

jobs:
  live:
    name: live contracts — ${{ inputs.suite || 'all' }}
    runs-on: ubuntu-latest
    # This job is allowed to fail loudly, and deliberately is not
    # `continue-on-error`. A green run that contained a failed assertion would
    # send no notification, and being told is the entire purpose here — a
    # scheduled workflow that goes red emails the repository owner, which is the
    # only channel a weekly check has.
    #
    # It still cannot block anyone: there is no `pull_request` trigger above, so
    # this never appears as a check on a PR. "Does not gate a merge" and "fails
    # visibly" are separate properties, and the first is bought by the trigger
    # list, not by swallowing the exit code.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # Which files to run, from the dispatch input. `all` is both, and is what
      # the schedule uses.
      - name: Choose the suite
        id: pick
        run: |
          case "${{ inputs.suite || 'all' }}" in
            ai)   echo "paths=tests/live/test_live_provider_contract.py" >> "$GITHUB_OUTPUT" ;;
            zoho) echo "paths=tests/live/test_live_zoho_contract.py"     >> "$GITHUB_OUTPUT" ;;
            *)    echo "paths=tests/live"                                >> "$GITHUB_OUTPUT" ;;
          esac

      # Both suites skip themselves when their credentials are absent, so a
      # repository with only one of the two configured still gets that one.
      # `-ra` prints every skip with its reason, which is the difference between
      # "nothing to run" and "silently ran nothing".
      - name: pytest -m live
        working-directory: backend
        env:
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZOHO_ORGANIZATION_ID: ${{ secrets.ZOHO_ORGANIZATION_ID }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          # The data centre the account belongs to. A refresh token issued in
          # one DC is rejected by every other, and getting this wrong is the
          # single most common cause of a "bad credentials" report that is not
          # about credentials at all.
          ZOHO_ACCOUNTS_BASE: ${{ vars.ZOHO_ACCOUNTS_BASE }}
          ZOHO_API_BASE: ${{ vars.ZOHO_API_BASE }}
        run: python -m pytest ${{ steps.pick.outputs.paths }} -m live -q -ra

      # Say plainly when nothing was configured. Without this the job is green
      # having run nothing, which is the state this workflow exists to end.
      - name: Note when a suite could not run
        if: always()
        env:
          HAVE_AI: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAVE_ZOHO: ${{ secrets.ZOHO_REFRESH_TOKEN != '' }}
        run: |
          [ "$HAVE_AI" = "true" ] || echo "::warning::ANTHROPIC_API_KEY is not set — the AI provider contract suite skipped."
          [ "$HAVE_ZOHO" = "true" ] || echo "::warning::ZOHO_REFRESH_TOKEN is not set — the Zoho contract suite skipped."

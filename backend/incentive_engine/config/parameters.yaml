# Every parameter the engine uses, dated and versioned.
#
# NOTHING IS HARDCODED IN THE ENGINE. A historical period recomputes identically
# because the config version that produced it is recorded on the output, and
# config blocks carry effective dates — a run for FY25 Q2 loads the block in
# force on that date, not today's.
#
# Governance (I6): these change AT MOST ANNUALLY and are published before the
# year starts. A mechanism people believe will be re-cut when they win is a
# discretionary bonus wearing a formula costume.

version: "2026.1"
effective_from: "2026-04-01"
effective_to: null                    # open — the block currently in force

# ── collection: the earning condition, not a KPI ────────────────────────────
# CAF is banked on invoice and EARNED on receipt. This single table replaces an
# entire "collections KPI" and removes any gain from billing early or selling
# to a customer who will not pay.
collection:
  # Days beyond agreed due date -> conversion factor. `to` is inclusive.
  # `from: null` means "advance / against delivery" (paid before due date by
  # more than the advance threshold).
  bands:
    - {label: "advance or against delivery", from: null, to: -1, factor: "1.10"}
    - {label: "on or before due date",       from: 0,    to: 0,  factor: "1.00"}
    - {label: "1-30 days late",              from: 1,    to: 30, factor: "0.90"}
    - {label: "31-60 days late",             from: 31,   to: 60, factor: "0.75"}
    - {label: "61-90 days late",             from: 61,   to: 90, factor: "0.50"}
    - {label: "91-120 days late",            from: 91,   to: 120, factor: "0.25"}
    - {label: "beyond 120 days",             from: 121,  to: null, factor: "0.00"}
  # Beyond this, any provisional payout is clawed back, not merely unearned.
  clawback_after_days: 120

# ── the cost of money ───────────────────────────────────────────────────────
# One rate, published, used on BOTH sides of the ledger. It was previously only
# under `vendor.valuation`, where it valued credit a supplier extends to us —
# so the mechanism paid for extracting credit days and charged nothing for
# giving them away. Promoted here so the two directions read the same number.
#
# NOT `commercial/config.py::carrying_cost_annual_pct`, and the two must never
# be merged. That one is RESTRICTED: monthly stock drain is
# `quantity x cost x rate / 12` and the quantity is on the row, so publishing
# it inverts every purchase cost in the catalogue. This one is applied to a
# SELLING price, leaks nothing, and has to be published for a salesperson to
# compute their own contribution (I4). Equal today by coincidence of the same
# bank rate; not the same parameter.
cost_of_capital:
  annual: "0.12"

# ── the currency ────────────────────────────────────────────────────────────
caf:
  # Toolkit charged at 50 paise in the rupee. This is the whole S<->C control:
  # the compliant weapon is priced at HALF the non-compliant one, so S reaches
  # for it first because it is cheaper, not because they were told to.
  toolkit_charge_rate: "0.50"
  # K is charged at 100 paise. Never change this without re-deriving 4.4 — the
  # 1:1 deduction is what makes S's first-order condition identical to the
  # owner's.
  third_party_charge_rate: "1.00"
  # Vendor yield credited at 1:1 (alpha). Section 12 of the design note offers
  # 1.25-1.50 as an "over-incentivise" variant; held at 1.0 because the brief's
  # success criterion is EV maximisation, and alpha > 1 pays out value that was
  # never contributed on the marginal rupee.
  vendor_yield_credit: "1.00"

  # ── the term charge: credit days, priced ───────────────────────────────────
  # CAF has no term for payment terms, so credit days are given away free on
  # every deal. `c(d)` does not catch it: c(d) reads days LATE against the DUE
  # date, and the due date already moves with whatever terms were agreed — so
  # 30 days and 90 days both score 1.00 for an invoice paid on time.
  #
  #     CAF = q(P - F) - K - 0.5T + Y - q x P x rate_annual x (d / 365)
  #
  # which is algebraically the existing formula with the floor grossed up:
  #
  #     CAF = (1 - k) x q x (P - F/(1-k)),   k = rate_annual x d / 365
  #
  # so the desk shows one number that already exists — a floor that rises with
  # the credit period — and `discount_to_floor` stays a subtraction (I5).
  #
  # DISCLOSURE: q, P and d are on the salesperson's own quote and this rate is
  # published, so the charge is computed entirely inside the selling-price
  # domain. It adds no equation containing F or cost. Contrast the stock
  # carrying rate, which is computed FROM cost — that is the difference, and it
  # is why this one is safe to publish and that one is not.
  term_charge:
    # OFF. Turning this on changes what people are paid, so it is a decision
    # somebody makes on a date, not a default that arrives with a deploy (I6).
    # Every number the engine produces with this false is bit-identical to what
    # it produced before the term existed.
    enabled: false
    # `cost_of_capital.annual` grossed up for GST. The receivable actually
    # funded is the tax-INCLUSIVE invoice — the tax is remitted before it is
    # collected — while `unit_price_net` is tax-exclusive. Charging 0.12 on a
    # tax-exclusive base under-recovers by the GST share, so the published rate
    # carries the gross-up rather than the formula carrying a second base.
    rate_annual: "0.1416"
    # What `d` means when a line does not carry one — a historical invoice, or
    # an entity that has not started recording agreed terms.
    #
    # NOT zero. Zero would read as "paid against delivery", which is the single
    # most valuable term in the book, and would hand every unrecorded line the
    # best possible treatment — absence of evidence passing as a pass, which is
    # the one thing the invariants refuse. Set to the book's own measured
    # revenue-weighted term so an unrecorded line is treated as ordinary rather
    # than as free money.
    assumed_days_when_unknown: 30
    # BEFORE ENABLING: `approvals._covers` freezes `quoted_unit_price` and
    # nothing else. While this is false that is harmless. Turn it on without
    # first putting credit days into the approval subject and an approval
    # granted at 30 days can be spent at 120 — the same defeat the approval
    # gate exists to prevent, through the one door it does not watch.

# ── floor prices ────────────────────────────────────────────────────────────
floor:
  # F = cost x (1 + m_floor). m_floor is OWNER ZONE and varies by family so F
  # cannot be inverted to cost from a single observed line.
  # These are defaults; the per-item FloorPriceSchedule overrides them.
  m_floor_by_family:
    inserts: "0.22"
    solid_carbide: "0.26"
    holders_toolsystems: "0.30"
    metrology: "0.34"
    chemicals: "0.18"
    machines: "0.12"
    default: "0.25"
  # Aged stock: F declines with age so clearing dead stock earns real points.
  # Expressed as a FRACTION OF THE NORMAL FLOOR, not of cost — the engine never
  # needs cost to apply it, which keeps the aged path inside the ops zone too.
  aged_floor_schedule:
    - {from_days: 0,   to_days: 180,  floor_fraction: "1.00", is_aged: false}
    - {from_days: 181, to_days: 365,  floor_fraction: "0.85", is_aged: true}
    - {from_days: 366, to_days: 545,  floor_fraction: "0.70", is_aged: true}
    - {from_days: 546, to_days: 730,  floor_fraction: "0.55", is_aged: true}
    - {from_days: 731, to_days: null, floor_fraction: "0.40", is_aged: true}
  aged_threshold_days: 180

# ── relationship strength ───────────────────────────────────────────────────
rsi:
  weights:
    tenure: 20
    # 35, not 20: it carries the 15 points share_of_wallet used to hold. Q5 of
    # DESIGN_DECISIONS already named regularity as the destination if
    # share-of-wallet failed to earn its place. It failed for a worse reason
    # than weak correlation — see below.
    regularity: 35
    breadth: 15
    # Zero, deliberately, and kept in the table rather than deleted.
    #
    # This was a number the salesperson supplies about their own account,
    # scored 15 of 100 in the index that sets w_base and w_inc — so the person
    # being paid was an input to their own multiplier. Nothing in the
    # application ever produced it either: the only constructions of
    # CustomerAttributes were in tests, so the weight was live and the value
    # was not.
    #
    # It stays listed at 0 so `components` still reports it and a reader can
    # see it was weighed and scored nothing, rather than wondering whether a
    # sixth component was ever here. Restoring a non-zero weight needs an
    # observed basis for the number, not a better-designed input box.
    share_of_wallet: 0
    payment_behaviour: 15
    contact_depth: 15
  # Saturation points: the value at which a component scores 100.
  tenure_months_full: 60          # 5 years of continuous purchase
  regularity_months_full: 12
  breadth_families_full: 6
  contacts_full: 4                # four live reachable decision-makers
  # Payment behaviour scores 100 at 0 days beyond terms, 0 at this many.
  days_beyond_terms_zero: 60
  bands:
    - {name: "New",         from: 0,  to: 25,  w_base: null,   w_inc: "1.80", toolkit_cap_pct: "0.15", retention_gate: "none"}
    - {name: "Developing",  from: 26, to: 50,  w_base: "1.10", w_inc: "1.60", toolkit_cap_pct: "0.10", retention_gate: "soft"}
    - {name: "Established", from: 51, to: 75,  w_base: "0.95", w_inc: "1.50", toolkit_cap_pct: "0.07", retention_gate: "hard"}
    - {name: "Anchor",      from: 76, to: 100, w_base: "0.85", w_inc: "1.60", toolkit_cap_pct: "0.05", retention_gate: "hard"}
  # An Established/Anchor account whose rolling-12 collected CAF falls by more
  # than this YoY without approved cause collapses ALL of that salesperson's
  # w_inc to 1.00. Hunting cannot be funded by letting the base rot.
  retention_gate_drop_pct: "0.20"
  retention_gate_w_inc: "1.00"

# ── portfolio health ────────────────────────────────────────────────────────
# Q = q_min + (q_max - q_min) x HealthScore, HealthScore in [0,1].
health:
  q_min: "0.85"
  q_max: "1.15"
  weights:
    logo_retention: 25            # was 30 — displaced by trial_conversion
    contact_depth: 20
    concentration: 15             # was 20 — displaced by trial_conversion
    dispute_rate: 15
    forecast_accuracy: 10         # was 15 — displaced by trial_conversion
    trial_conversion: 15          # Q2(b): the hold-up control, portfolio-level
  # Herfindahl penalty begins above this share in a single account.
  concentration_penalty_above: "0.40"
  # Credit notes as % of CAF at which the dispute component scores zero.
  dispute_rate_zero_at: "0.10"
  contacts_full: 3                # avg live contacts per Established/Anchor
  # Q2(b): a proven item counts as converted if a repeat order lands within N.
  trial_conversion_months: 6
  # Q2(c): a trial carrying >= this many lock-in factors counts full weight in
  # the numerator; a proven-but-unlocked trial counts at the reduced rate.
  trial_lockin_factors_for_full_credit: 2
  trial_unlocked_credit: "0.50"

# ── gates ───────────────────────────────────────────────────────────────────
# Binary. Failure WITHHOLDS the period; it does not destroy it. Permanent
# forfeiture drives concealment, deferral drives correction.
gates:
  cure_days:
    G1_compliance: 60
    G2_data_integrity: 60
    G3_receivables: 60
  # G3: an invoice past this many days overdue needs a formally escalated
  # recovery plan on record or the gate fails.
  receivables_escalation_days: 120
  # Q6: discovered undeclared K. 3x makes the expected value of concealment
  # negative at any detection probability above ~25%.
  undeclared_k_clawback_multiple: "3.00"
  undeclared_k_forfeits_bank: true

# ── new accounts ────────────────────────────────────────────────────────────
bayesian:
  provisional_rate: "0.50"
  release_min_invoices: 3
  release_min_quarters: 2

# ── aged stock recovery (Q1) ────────────────────────────────────────────────
# A SEPARATE POOL from CAF, deliberately. See DESIGN_DECISIONS.md Q1(a): below
# some age F_aged < cost, so a cash-losing line would produce positive CAF and
# corrupt the margin signal S is learning from.
recovery:
  # Bounty rate on (realised price - aged write-down floor) x qty.
  # DECLINES WITH AGE so recovery is front-loaded and nobody profits by waiting.
  bounty_rate_by_age:
    - {from_days: 181, to_days: 365,  rate: "0.25"}
    - {from_days: 366, to_days: 545,  rate: "0.20"}
    - {from_days: 546, to_days: 730,  rate: "0.15"}
    - {from_days: 731, to_days: null, rate: "0.10"}
  # Q1(c): open to ANYONE in the company. Proposer spots the match, closer
  # carries the customer relationship cost of the substitution.
  proposer_share: "0.40"
  closer_share: "0.60"
  # Q1(d) + Q3(b) THE SAME RULE: whoever caused the stock earns this fraction
  # of the normal bounty on that specific stock. Not zero — zero makes them
  # hide it, and hidden dead stock is worse than cheaply-cleared dead stock.
  causer_bounty_multiplier: "0.25"
  # Returned or disputed within this window and the bounty reverses.
  clawback_window_days: 90

# ── vendor sub-game (Q3) ────────────────────────────────────────────────────
vendor:
  # Q3(b): commitment-linked Y is credited PROVISIONALLY and released only as
  # the committed stock actually sells. This is the single loop tying the
  # vendor sub-game to the inventory sub-game.
  commitment_release_on_sale: true
  # Unsold residual at this horizon is charged back under the Q1(d) causer rule.
  commitment_residual_months: 18
  # Q3(c) valuation conventions for non-price concessions.
  valuation:
    free_tooling: "1.00"          # at standard buy price
    demo_stock: "0.50"            # it comes back; half credit
    training_day_cap: "25000"     # per day, market rate cap
    # Extended credit is valued at `cost_of_capital.annual` x amount x days/365.
    # The rate moved to the top level so the sell side charges what the buy side
    # credits; this key is gone rather than duplicated.
  # Vendor SPIFFs: surrendered -> re-credited as Y; retained -> deducted 1:1.
  spiff_retained_charge_rate: "1.00"

# ── payout ──────────────────────────────────────────────────────────────────
payout:
  # r is PER ENTITY. SLS at ~19Cr and 4U at ~37L cannot share a rate.
  #
  # These are placeholders pending the Phase-1 shadow run (Q4), and 0.0000 is
  # now REFUSED by payout.rate_for_entity rather than applied. That is the
  # difference between a mechanism that is not ready and a month in which
  # everybody earned nothing — which, until the guard existed, looked
  # identical from every screen and every log line.
  #
  # To go live: solve r from that entity's own shadow-run CAF and put it here.
  # To state on purpose that an entity pays no share: set it to `null`, which
  # the refusal reports by name.
  r_by_entity:
    SLS: "0.0000"
    4U:  "0.0000"
    UPS: "0.0000"
  cash_share: "0.70"
  relationship_bank_share: "0.30"
  bank_release_months: 12
  # Soft accelerator above target — no threshold to game because it applies
  # only to the excess.
  accelerator_above_target_pct: "1.30"
  accelerator_rate_multiple: "1.15"

# ── multi-agent (attribution) ───────────────────────────────────────────────
attribution:
  # COMPANY-FUNDED, not deducted from the account owner. That is the detail
  # that makes knowledge-sharing Pareto-improving.
  assist_share: "0.15"            # within the 10-20% band
  assist_company_funded: true
  handover_tail_share: "0.25"
  handover_tail_quarters: 2
  dormancy_quarters_to_pool: 2

# The gate from CLAUDE.md §6, run by a machine instead of by memory.
#
# Every step here is one a person was already told to run before merging. The
# only change is that forgetting is no longer possible — which matters most for
# the migration job below, the check that would have caught the incident §4 was
# written about and the one nobody runs on an already-migrated laptop.
#
# Jobs are split so a failure names itself in the checks list. "backend" going
# red tells you more than one "ci" going red does.
name: gate

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch supersedes the first. The gate is a
# statement about the head commit, so testing an overtaken one is spend with no
# reader.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    name: §1 invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The two greps CLAUDE.md §1 tells a human to run. `test_layer_boundaries`
      # covers the same ground by parsing imports, and is the check that blocks
      # — this runs anyway because it is seconds, and because a failure here is
      # legible without reading a traceback.
      - name: Deterministic layers must not import ai/
        run: |
          if grep -rnE '^\s*(from|import)\s+\.*\.?ai[. ]' \
               backend/app/commercial backend/app/signals \
               backend/app/ingestion backend/app/state; then
            echo "::error::A deterministic layer imports ai/. Prices, margins and"
            echo "::error::priorities are computed there and only read in ai/."
            exit 1
          fi
      - name: ai/ must not import commercial/
        run: |
          if grep -rnE '^\s*(from|import)\s+.*commercial' backend/app/ai; then
            echo "::error::ai/ imports commercial/. It receives facts; it must"
            echo "::error::never be able to compute one."
            exit 1
          fi

  backend:
    name: backend — ruff + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # ruff is PINNED. It used to be installed unpinned, a release grew the
      # pyupgrade family in its default rule set, and the next push found 1,314
      # errors in untouched code. Because this step precedes `pytest` in the same
      # job, the entire backend suite stopped running — for days, behind a red X
      # that read like a test failure. `backend/ruff.toml` now states the rule
      # set explicitly; this pin keeps the binary from moving under it.
      - run: pip install -r backend/requirements.txt ruff==0.15.8
      - name: ruff
        run: ruff check backend/app

      # The cross-repo integration tests resolve real product codes through
      # pie-parser, which is a separate private repository. With a token they run
      # for real; without one they skip and say so (tests/conftest.py). What they
      # must never do is take the rest of the suite down with them, which is what
      # the old session-wide autouse fixture did.
      #
      # Through `setup_pie_parser.sh` rather than a `git clone` written out here,
      # because that script owns the PIN. A second clone in this file would
      # fetch master, and CI would then be testing against a different engine
      # revision than every developer — the kind of difference that surfaces as
      # "passes locally, fails in CI" and costs a day to find.
      - name: Fetch pie-parser at the pinned commit
        id: parser
        env:
          TOKEN: ${{ secrets.PIE_PARSER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PIE_PARSER_TOKEN is not set — product resolution"
            echo "::warning::tests will SKIP. Add a read-only token for"
            echo "::warning::srisankethu/pie-parser to run them here."
            exit 0
          fi
          # The token reaches git through the credential rewrite rather than the
          # command line, so it is never part of an argument that could be echoed.
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          ./scripts/setup_pie_parser.sh
          echo "root=${{ github.workspace }}/pie-parser" >> "$GITHUB_OUTPUT"

      # `-p no:randomly` is not used: the suite is order-independent by design
      # and finding out otherwise is worth a red build.
      #
      # `-ra` so a skip is reported with its reason. A silent skip is how a test
      # stops running without anyone noticing, which is the failure this whole
      # job is recovering from.
      - name: pytest
        working-directory: backend
        env:
          PIE_PARSER_ROOT: ${{ steps.parser.outputs.root }}
        run: python -m pytest tests -q -ra

  migrations:
    name: migrations on an empty database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # The EMPTY case. A developer's own database is already migrated and can
      # never exercise this; production always can. §4 exists because the
      # schema and the models drifted apart in 130 places and nobody had run
      # autogenerate against a fresh database.
      - name: alembic upgrade head, from nothing
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gate.db
        run: |
          rm -f /tmp/gate.db
          python -m alembic upgrade head
      - name: schema must match the models exactly
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gate.db
        run: python -m pytest tests/decision_platform/test_migrations_integrity.py -q
      # Two heads means two branches each added a migration and nobody merged
      # them. It fails on the one deployment that runs them in the wrong order,
      # which is always the production one.
      - name: exactly one head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/gate.db
        run: |
          heads=$(python -m alembic heads | grep -c . || true)
          if [ "$heads" -ne 1 ]; then
            python -m alembic heads
            echo "::error::$heads migration heads. Run: alembic merge -m 'merge' <rev> <rev>"
            exit 1
          fi

  frontend:
    name: frontend — types + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        # The browsers are not needed to typecheck or build, and downloading
        # them on every run is minutes for nothing.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      # Before the build, because a failing assertion is a more useful message
      # than a failing bundle, and because the build is the slower of the two.
      #
      # `LineGrid.test.tsx` is the one to keep an eye on: it renders the quote
      # grid for a sales role from a fixture that deliberately carries cost and
      # margin, and asserts neither appears. The server not sending them is the
      # real guarantee and is tested in the backend suite — this catches the
      # separate way it could break, a component rendering whatever it is handed.
      - name: vitest
        working-directory: frontend
        run: npm test
      - name: tsc + vite build
        working-directory: frontend
        run: npm run build

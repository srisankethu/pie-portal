# pie-portal, self-hosted: Postgres, the API, and a TLS edge that serves the
# built app and proxies /api to the API on the same origin.
#
#   cp deploy/production.env.example .env.production   # then fill it in
#   make deploy-build
#   make deploy-release        # migrations + seed — the deliberate step
#   make deploy-up
#
# The full runbook, including DNS and backups, is in docs/hosting.md.
#
# Note the shape of the dependency graph: `api` depends on `db`, and nothing
# depends on `release`. Bringing the stack up cannot migrate the database — that
# is CLAUDE.md §4, expressed in the topology rather than in a comment nobody
# reads at 9pm.

name: pie-portal

# Everything the backend reads from the environment. Anchored rather than
# repeated so `api` and `release` cannot drift apart — a release that migrated a
# *different* database than the one the API serves is a bad afternoon.
#
# The full setting reference is docs/operations.md; this is the subset a
# deployment actually has to decide.
x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pie_portal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@db:5432/${POSTGRES_DB:-pie_portal}

  # The connection that SERVES REQUESTS, as a role row-level security binds.
  #
  # `DATABASE_URL` above owns the schema. A policy binds the role that issued
  # the query and nothing binds a superuser, so every `tenant_isolation` policy
  # in this database is inert while requests are served as the owner — which is
  # what every deployment did until this line existed. `deploy/release.sh`
  # creates the role (NOSUPERUSER, NOBYPASSRLS, owner of nothing) and this
  # points the request path at it.
  #
  # `:+` rather than `:?`: with APP_DB_PASSWORD unset this expands to empty,
  # config.py reads empty as unset, and the deployment runs exactly as it did
  # before — an existing .env.production keeps working. Setting the password is
  # the deliberate act, and `/api/v1/internal/observability/health` reports
  # `tenant_isolation` UNHEALTHY until it is taken. Do not soften that: a
  # connection that cannot be governed is the finding.
  #
  # Ordering matters once. `make deploy-release` creates the role;
  # `make deploy-up` starts serving as it. The documented runbook already runs
  # them in that order, and running `up` first gives an API that cannot connect
  # rather than one quietly serving without policies — the safer of the two.
  APP_DATABASE_URL: ${APP_DB_PASSWORD:+postgresql+psycopg://${APP_DB_ROLE:-pie_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-pie_portal}}
  APP_DB_ROLE: ${APP_DB_ROLE:-pie_app}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}

  # Both refuse to boot the app while they hold their development defaults,
  # because both defaults are published in the source. `:?` makes that a compose
  # error with a readable message instead of a container that crash-loops.
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env.production — see docs/hosting.md}
  CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env.production — see docs/hosting.md}
  SEED_PASSWORD: ${SEED_PASSWORD:-}

  # Empty on purpose. The app and the API share one origin behind Caddy, so
  # same-origin requests never consult CORS — and an empty allow-list means a
  # page on any *other* origin gets nothing.
  CORS_ORIGINS: ""

  # The catalogue was decoded into the image at build time, so a request should
  # never trigger a corpus decode. docs/operations.md: "Set 0 in constrained
  # deploys and build out of band."
  AUTO_BUILD_CATALOG: "0"
  PIE_WARM: ${PIE_WARM:-1}
  UVICORN_WORKERS: ${UVICORN_WORKERS:-2}

  ZOHO_SOURCE: ${ZOHO_SOURCE:-fixture}

  # Background work goes through the durable queue here, because this is the
  # deployment where a thread loses it: `deploy-up` replaces containers, and a
  # sync that was QUEUED when its container went is never done. The `worker`
  # service below drains it; the API is told not to (QUEUE_WORKER=0) so the
  # long jobs run somewhere that is not serving requests.
  SYNC_DISPATCH: ${SYNC_DISPATCH:-queue}

  # Postgres pool. The defaults' arithmetic is documented on the settings in
  # config.py, and this stack's total is:
  #
  #   api     2 uvicorn workers × (5 + 10)          = 30
  #   worker  N containers × (3 + 2), see below     = 5 per worker
  #   release runs alone, briefly                    ~ 5
  #
  # So one worker is 40 and `--scale worker=6` is 65, against stock
  # max_connections=100 — with room for psql and a replica. Redo this
  # arithmetic before raising anything here or scaling workers past ~10.
  # ── Self-serve sign-up ───────────────────────────────────────────────────
  # `deploy/production.env.example` has told operators to set SELF_SERVE_SIGNUP=1
  # since it was written, and this file never passed it into the container — so
  # setting it did exactly nothing, and the deployment kept answering
  # `GET /api/v1/signup` with `enabled: false`. The landing page then hid its own
  # sign-up button, correctly, because the API said there was no door. The
  # feature was complete the whole time; the stack could not be told to switch
  # it on.
  #
  # Off by default here, exactly as `config.py` is: an existing single-tenant
  # install that pulls new code must not silently begin accepting strangers.
  # That default is the point, not caution.
  SELF_SERVE_SIGNUP: ${SELF_SERVE_SIGNUP:-0}
  SIGNUP_RATE_LIMIT_PER_HOUR: ${SIGNUP_RATE_LIMIT_PER_HOUR:-5}
  # Mirrors the code default rather than choosing one, so adding this line
  # changes nothing for a stack that never set it. It does *not* decide what a
  # sign-up gets: `onboarding.SIGNUP_PLAN` pins every self-serve tenant to free
  # whatever this says, which is why turning sign-up on cannot hand a stranger
  # the top tier.
  DEFAULT_PLAN: ${DEFAULT_PLAN:-platform}

  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  # On in production (unlike the code default of 0): a statement slower than
  # half a second is worth a log line before it is worth a support call. The
  # line carries the statement only — parameter values never reach the log.
  DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}

  AI_PROVIDER: ${AI_PROVIDER:-mock}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-haiku-4-5-20251001}
  # Indicative defaults produce confidently wrong money. docs/operations.md
  # calls setting these a go-live gate; they are here so it is one edit.
  AI_COST_PER_MTOK_INPUT: ${AI_COST_PER_MTOK_INPUT:-1.0}
  AI_COST_PER_MTOK_OUTPUT: ${AI_COST_PER_MTOK_OUTPUT:-5.0}

  DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-org_pie}
  DEFAULT_ORG_NAME: ${DEFAULT_ORG_NAME:-PIE}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}

x-api-build: &api-build
  context: .
  dockerfile: deploy/backend.Dockerfile

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pie_portal}
      POSTGRES_USER: ${POSTGRES_USER:-pie_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `api` waits on this. Without it the first deploy races Postgres'
      # initdb and the API's first connection attempt is the one that loses.
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER:-pie_portal} -d ${POSTGRES_DB:-pie_portal}"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  api:
    build: *api-build
    image: pie-portal-api:latest
    environment:
      <<: *backend-env
      # The API queues work; the worker service runs it. A uvicorn process that
      # also drains the queue spends its request threads on hour-long pulls.
      QUEUE_WORKER: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /api/health is the one that can fail: it reports 503 when the schema is
      # behind the code, which is exactly the deploy that otherwise looks
      # healthy right up until somebody opens the screen reading the new column.
      # Before the first `deploy-release` this is *expected* to be red.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Warming the pie-parser catalogue takes a while on a small box.
      start_period: 90s
    restart: unless-stopped

  # Drains `queued_messages`: the background sync and the metric rebuilds. Same
  # image and same environment as the API, one setting apart — which is the
  # point of `QUEUE_WORKER`, and why a message the API queues is one this
  # container can run.
  #
  # Scale it to taste: `docker compose up -d --scale worker=3`. The claim is a
  # conditional UPDATE, so several workers take different messages rather than
  # racing for the same one.
  #
  # No healthcheck and no port: it serves nothing. Whether it is draining is
  # `GET /api/v1/internal/queue` on the API — `worker_running` is false *there*
  # by design, and the depth is what says this container is keeping up.
  worker:
    build: *api-build
    image: pie-portal-api:latest
    environment:
      <<: *backend-env
      QUEUE_WORKER: "1"
      # Its own pool arithmetic, because it is not shaped like the API. One
      # process, and at most three connections in flight at once: the drain
      # loop's session, the heartbeat's (a running handler must keep its
      # message alive on a session of its own), and the handler's own. 3+2 is
      # that with room, and it is what keeps `--scale worker=N` inside the
      # budget the header above computes — six workers at the API's 5+10 would
      # be 90 connections on their own.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        # Every canonical URL, og:url and sitemap entry the build bakes comes
        # from this one value (frontend/scripts/prerender.mjs). The build arg
        # existed and this file never passed it, so a self-host published its
        # pages pointing a crawler at the hosted deployment's domain — which
        # mattered once, and matters four times now that there are four pages.
        #
        # Deliberately not defaulted from SITE_ADDRESS: that value is allowed
        # to be ":80" for a local run, and "https://:80" is a worse canonical
        # URL than the documented fallback. Set SITE_ORIGIN in .env.production
        # when this deployment has a real name; empty is handled — the
        # prerender uses `||`, not `??`, for exactly this case.
        SITE_ORIGIN: ${SITE_ORIGIN:-}
    image: pie-portal-web:latest
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production — a hostname for automatic HTTPS, or :80 for local}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Issued certificates and the ACME account key. Losing this volume is not
      # fatal — Caddy re-issues — but it does burn Let's Encrypt rate limit, so
      # keep it across deploys.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      # Deliberately service_started, not service_healthy: when the API is down
      # or its schema is behind, the edge should still come up and let the app
      # say so. A blank browser tab diagnoses nothing.
      api:
        condition: service_started
    restart: unless-stopped

  # Migrations and seeding. Behind a profile so it never runs as part of
  # `up` — see the header, and CLAUDE.md §4.
  #
  #   docker compose --profile release run --rm release
  release:
    build: *api-build
    image: pie-portal-api:latest
    environment:
      <<: *backend-env
      # It creates that role; it must not be asked to connect as it first.
      # `db.py` builds the app engine at import when this is set, and on the
      # first deploy the role does not exist yet.
      APP_DATABASE_URL: ""
    command: ["/app/deploy/release.sh"]
    depends_on:
      db:
        condition: service_healthy
    profiles: ["release"]
    restart: "no"

volumes:
  db-data:
  caddy-data:
  caddy-config:

# The gate from CLAUDE.md §6, run by a machine instead of by memory.
#
# The checks themselves live in ./scripts/verify.sh, which `make verify` also
# runs. That is deliberate: this file used to restate what CLAUDE.md §6 told a
# person to run, the two lists drifted, and the drift was invisible for eight
# consecutive merges to main — CI installed ruff unpinned and reported 1314
# errors against an unchanged tree, and because lint ran before pytest in one
# job the 1174-test suite was skipped every run. One list, run from both places.
#
# Four jobs, and the split is on a real axis rather than a cosmetic one:
#
#   invariants / frontend  fast, and independent of the pie-parser engine, so
#                          they keep giving signal whatever happens to it. They
#                          repeat a check `verify` also runs; that duplication
#                          is the point, and `verify` stays complete regardless.
#   verify                 the whole gate, including `alembic upgrade head` on an
#                          EMPTY database — the check §4 was written about, and
#                          the one nobody runs on an already-migrated laptop.
#   pie-contract           the only job that needs a credential. A missing one
#                          now fails this job and nothing else — the split is
#                          what keeps an expired token from taking the whole
#                          gate down with it, while still refusing to call the
#                          seam tested when it was not.
name: gate

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch supersedes the first. The gate is a
# statement about the head commit, so testing an overtaken one is spend with no
# reader.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    name: §1 invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The two greps CLAUDE.md §1 tells a human to run. `test_layer_boundaries`
      # covers the same ground by parsing imports, and is the check that blocks
      # — this runs anyway because it is seconds, and because a failure here is
      # legible without reading a traceback.
      - name: Deterministic layers must not import ai/
        run: |
          if grep -rnE '^\s*(from|import)\s+\.*\.?ai[. ]' \
               backend/app/commercial backend/app/signals \
               backend/app/ingestion backend/app/state; then
            echo "::error::A deterministic layer imports ai/. Prices, margins and"
            echo "::error::priorities are computed there and only read in ai/."
            exit 1
          fi
      - name: ai/ must not import commercial/
        run: |
          if grep -rnE '^\s*(from|import)\s+.*commercial' backend/app/ai; then
            echo "::error::ai/ imports commercial/. It receives facts; it must"
            echo "::error::never be able to compute one."
            exit 1
          fi

  frontend:
    name: frontend — types + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        # The browsers are not needed to typecheck or build, and downloading
        # them on every run is minutes for nothing.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: tsc + vite build
        working-directory: frontend
        run: npm run build

  # The check that would have caught the pin skew. pie-parser is vendored as a
  # submodule, so the commit this repo resolves against is a line in the index —
  # but a pin that nothing executes is a pin nobody has tested. Moving it used
  # to be verified by hand, and the last move was made *because* the previous
  # commit made every scoped line resolve to nothing at all, which is exactly
  # the kind of failure a green build should not survive.
  #
  # Deliberately its own job rather than steps inside `backend`: the seam is
  # what this proves, and a failure here should name the engine rather than
  # hide behind an unrelated lint or unit failure.
  verify:
    name: verify — lint, tests, frontend, migrations
    runs-on: ubuntu-latest
    steps:
      # checkout@v4 / setup-python@v5 / setup-node@v4 target Node 20, which
      # GitHub now forces onto Node 24 with a deprecation warning. They run
      # correctly; bumping to the Node 24 majors is a separate one-line change
      # that should be made once and watched go green, not bundled in here.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # requirements-dev.txt pins ruff, pytest, pytest-xdist and cffi exactly,
      # and ruff.toml writes the rule set down. Both halves are needed: a pinned
      # version with implicit rules breaks on the next bump, and a written rule
      # can still change meaning between versions. cffi is here because without
      # it Debian's `cryptography` panics at import and takes 22 test modules
      # with it at collection.
      - name: install pinned tooling
        run: python -m pip install -r backend/requirements-dev.txt

      - name: install frontend dependencies
        working-directory: frontend
        # The browsers are not needed to typecheck or build, and downloading
        # them on every run is minutes for nothing.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      # The same script a developer runs. Lint, the §1 invariants, the backend
      # suite (parallel, per-worker databases), the frontend production build,
      # and `alembic upgrade head` on an EMPTY database plus the drift test and
      # the single-head check.
      #
      # The pie-parser submodule is deliberately NOT fetched here. Without the
      # engine, conftest skips the `requires_pie` tests and everything else runs
      # — so this job needs no credential and cannot be held hostage by one.
      # The seam those tests cover is the `pie-contract` job's whole purpose.
      #
      # verify.sh runs every check and reports all failures at the end rather
      # than stopping at the first, so one red build names everything that is
      # wrong — the specific behaviour whose absence hid the suite behind lint.
      - name: verify
        run: ./scripts/verify.sh

  pie-contract:
    name: pie-parser contract — the pinned engine still resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pie-parser is a private repository and the default GITHUB_TOKEN is
      # scoped to *this* one, so fetching the submodule needs a credential of
      # its own. This step used to warn and let the job pass without it, and
      # that was right while no such secret existed: a red check nobody has the
      # means to fix is a check people learn to scroll past.
      #
      # The secret exists now, so the correct behaviour inverts — and the reason
      # is a date. A fine-grained PAT expires, a year at most. On the morning it
      # does, a step that only warns would go back to reporting success in six
      # seconds having fetched nothing and run nothing, and every PR after that
      # would carry a green tick for a seam that stopped being tested. That is
      # precisely the failure this job exists to prevent, reintroduced on a
      # timer and harder to notice the second time.
      #
      # So absence is a failure, and the message leads with expiry, because
      # after today that is what will actually have happened.
      - name: The engine must be reachable
        id: reachable
        env:
          PIE_PARSER_TOKEN: ${{ secrets.PIE_PARSER_TOKEN }}
        run: |
          # The pin, read out of this repo's index — exact, and available
          # before the submodule is fetched.
          echo "pin=$(git rev-parse HEAD:pie-parser)" >> "$GITHUB_OUTPUT"
          if [ -z "${PIE_PARSER_TOKEN}" ]; then
            echo "::error title=pie-parser contract cannot run::\
          PIE_PARSER_TOKEN is unset or empty, so the pinned engine was not \
          fetched and the seam is untested. The usual cause is an expired \
          fine-grained token. Reissue one with Contents:Read on \
          srisankethu/pie-parser only, and update the secret under \
          Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Fetch pie-parser at the pinned commit
        env:
          PIE_PARSER_TOKEN: ${{ secrets.PIE_PARSER_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PIE_PARSER_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive pie-parser
          echo "pinned at $(git -C pie-parser rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: install
        run: pip install -r backend/requirements.txt

      # The catalogue is ~13 MB decoded from the corpus and is a pure function
      # of the pinned commit, so it is cached against exactly that — a pin move
      # invalidates it, which is the one time it must be rebuilt.
      - name: Cache the decoded catalogue
        uses: actions/cache@v4
        with:
          path: backend/data/products.jsonl
          key: pie-catalog-${{ steps.reachable.outputs.pin }}

      # Selected by marker, not by a list of files: `requires_pie` is already
      # how conftest decides what to skip without an engine, so the set this
      # runs is by construction exactly the set the `backend` job could not
      # cover. A new engine-backed test is picked up by marking it, and a file
      # list here could not go stale because there isn't one.
      - name: The engine resolves what the portal expects
        working-directory: backend
        run: python -m pytest -q -m requires_pie tests

      # A marker that selects nothing means the seam is no longer covered —
      # most likely someone removed the last marked test, which should be a
      # deliberate act rather than a quietly green job.
      - name: The contract must actually cover something
        working-directory: backend
        run: |
          n=$(python -m pytest -q -m requires_pie --collect-only tests 2>/dev/null \
              | grep -c '::' || true)
          echo "engine-backed tests: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::No tests are marked requires_pie — the pinned engine is untested."
            exit 1
          fi

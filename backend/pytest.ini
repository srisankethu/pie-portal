[pytest]
testpaths = tests
# The live contract suites call a real model and a real Zoho book — they cost
# money and need credentials — so they are excluded from the default run.
# Opt in with:  pytest -m live   (or `make test-live`, or the live.yml workflow)
addopts = -m "not live"
markers =
    live: exercises a real external system — the AI provider or the Zoho Books
        API; requires credentials; excluded by default
